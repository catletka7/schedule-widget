name: Build ScheduleWidget IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Create keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

      - name: Import distribution certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Import provisioning profile
        if: env.APPLE_PROVISIONING_PROFILE != ''
        run: |
          echo "$APPLE_PROVISIONING_PROFILE" | base64 -d > ScheduleWidget.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp ScheduleWidget.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Set up code signing (automatic for development)
        if: env.APPLE_CERTIFICATE == ''
        run: |
          # Use automatic signing for development builds
          xcodebuild -project ScheduleWidget.xcodeproj \
            -scheme ScheduleWidget \
            -configuration Release \
            -destination generic/platform=iOS \
            -showBuildSettings | grep -E "(CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM)"

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -project ScheduleWidget.xcodeproj \
            -scheme ScheduleWidget \
            -configuration Release \
            -archivePath build/ScheduleWidget.xcarchive \
            -destination generic/platform=iOS \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM:-}"

      - name: Export IPA
        run: |
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM:-}</string>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ScheduleWidget.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleWidget-ipa
          path: build/ipa/ScheduleWidget.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/ipa/ScheduleWidget.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages (for direct install)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/ipa
          destination_dir: .
          keep_files: true

  # Alternative: Build with fastlane for easier certificate management
  build-fastlane:
    name: Build with Fastlane
    runs-on: macos-14
    timeout-minutes: 30
    if: false  # Set to true if you have certificates configured

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Build with fastlane
        run: |
          cd fastlane
          fastlane build
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleWidget-ipa-fastlane
          path: fastlane/ScheduleWidget.ipa